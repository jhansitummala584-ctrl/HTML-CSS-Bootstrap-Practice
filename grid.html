<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .container{
            width: 800px;
            height: 400px;
            background-color: lightgrey;
            box-shadow: 2px 2px 2px black;
            margin: 50px auto;
            border-radius: 10px;
            display:grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            grid-template-columns: 1fr 2fr 3fr;

        }
        .child{
            background-color: red;
            margin: 10px;

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="child">
            child1
        </div>
        <div class="child">
            child2
        </div>
        <div class="child">
            child3
        </div>
        <div class="child">
            child4
        </div>
        <div class="child">
            child5
        </div>
        <div class="child">
            child6
        </div>
        <div class="child">
            child7
        </div>
        <div class="child">
            child8
        </div>


    </div>





</body>
</html>
