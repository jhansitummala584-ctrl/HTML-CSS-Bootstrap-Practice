<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        .card{
            width: 350px;
            height: 630px;
            margin: 50px;
            box-shadow: 0px 0px 4px black;
            border-radius: 4px;
        }
        .card img{
            width: inherit;
            border-radius: 4px 4px 0px 0px;
        }
        .card-body{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .card-body h1{
            color: gray;
            margin-bottom: 10px;
        }
        .card-body dt{
            font-weight: bolder;
            margin-bottom: 10px;
        }
        .card-body dd{
            margin-bottom: 5px;
        }
        .card-body button{
            border: none;
            background: red;
            color: white;
            padding: 10px 20px;
            font-size: 18px;
            border-radius: 4px;
            box-shadow: 4px 4px 2px black;
            margin-top: 20px;
        }

    </style>
</head>
<body>
    <div class="card">
        <img src="images/pizza.jpg">
        <div class="card-body">
            <h1>Veg Pizza</h1>
            <dt>Price</dt>
            <dd>&#8377;200/-</dd>
            <dt>Rating</dt>
            <dd>4.5</dd>
            <button>Add To Cart</button>
        </div>

    </div>
</body>
</html>
