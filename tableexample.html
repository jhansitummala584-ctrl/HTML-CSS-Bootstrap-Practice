<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 align="center">HTML Nested Tables</h1>
    <table align="center" border="1" width="70%" height="70%" cellpadding="10px" cellspacing="0px" background="images/flower68.jpg">
        <tr width="100%">
            <th width="70%" align="left">Employees</th>
            <th width="30%" align="left">Networth</th>
        </tr>
        <tr>
            <td>
                <table border="1" width="100%" cellpadding="10px" cellspacing="0px">
                <tr>
                    <th>Name</th>
                    <th>Salary</th>
                </tr>
                <tr>
                    <td>Ram</td>
                    <td>100000</td>
                </tr>
                <tr>
                    <td>Janu</td>
                    <td>50000</td>
            </table>
            </td>
            <td>12,000</td>
        </tr>
    </table>
</body>
</html>
