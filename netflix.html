<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        *{
            margin:0px;

        }
        body{
            background-image: url("images/banner.jpg");
            background-size: cover;
            background-repeat: no-repeat;

        }
        #blur{
            background-color: rgba(0, 0, 0, 0.5);
            height:100vh;
        }
        header{
            display: flex;
            color: white;
            justify-content: space-between;
            padding:20px 100px;
        }
        #logo{
            font-size: 40px;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: red;

        }
        #dropdown{
            width:150px;
            height:40px;
            padding:5px;
            border-radius:4px;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color:rgba(0, 0, 0, 0.5);
            color:white;
            font-size:15px;
            margin-right:20px;
        }
        #btn{
            background-color: red;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 15px;
            border: none;
            font-weight: bold;
        }
        main{
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height:400px;
            text-align: center;

        }
        main h1{
            font-size: 60px;
            width: 500px;
            margin: 0 auto;
        }
        #p1{
            margin-top: 10px;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight:700px;
        }
        #p2{
            margin-bottom: 20px;
        }
        #email{
            width: 400px;
            height: 40px;
            border-radius: 4px;
            padding-left: 10px;
            font-size: 15px;
            background-color: rgba(0, 0, 0, 0.5);
            box-shadow: 2px 2px 2px rgba(255, 255, 255, 1);
            position: absolute;
            left: 30px;
            display: inline-block;
        }
        #get-started{
            width: 150px;
            height: 40px;
            border-radius: 4px;
            background-color: red;
            color: white;
            font-size: 15px;
            font-weight: bold;
            position: absolute;
            left: 68px;
        }
    </style>
</head>
<body>
    <div id="blur">
        <header>
            <div>
                <h1 id="logo">NETFLIX</h1>
            </div>
            <div>
                <select id="dropdown">
                    <option>English</option>
                    <option>Hindi</option>
                    <option>Telugu</option>
                </select>
                <input id="btn" type="button" value="Sign in">
            </div>
        </header>
        <main>
            <h1> Unlimited movies, shows, and more</h1>
           
<p id="p1">Starts at ₹149. Cancel at any time.</p>

<p id="p2">Ready to watch? Enter your email to create or restart your membership.</p>
<input id="email" type="text" value="Email address" style="width: 400px; height: 40px; border-radius: 4px; padding-left: 10px; font-size: 15px;  color:grey">
<input id="get-started" type="button" value="Get Started" style="width: 150px; height: 40px; border-radius: 4px; background-color: red; color: white; font-size: 15px; font-weight: bold;">
        </main>
    </div>
</body>
</html>
