<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body class="container mt-5">
    <span class="bi bi-justify fs-2 fw-bold" data-bs-toggle="offcanvas" data-bs-target="#hello"></span>
    <div class="offcanvas offcanvas-start" id="hello">
        <div class="offcanvas-header bg-dark text-white">
            <span class="bi bi-person-circle fs-2"></span>
            <span class="ms-2 fw-bold">Hello,sign in</span>
            <span class="btn btn-close btn-close-white" data-bs-toggle="offcanvas"></span>
        </div>
        <div class="offcanvas-body">
            <h4>Trending</h4>
            <div>
                <p>Best Sellers</p>
            </div>
            <div>
                New Releases
            </div>
            <div>
                <hr>
            </div>
        </div>
        <div class="offcanvas-footer">
            <span class="btn btn-danger w-100 px-3 fs-2 fw-bold">Sign out</span>
        </div>
    </div>
    
</body>
</html>
