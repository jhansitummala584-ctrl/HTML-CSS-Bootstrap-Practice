<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        h1{
            text-align: center;
            font-family: Arial;
            color:violet;
            font-size: 50px;
            transition: all linear 1s;
        }
        h1:hover{
            color:green;
            text-shadow: 2px 2px 5px black;
            transition: all linear 1s;
            font-size: 100px;
        }
        #img1{
            width: 200px;
            height: 200px;
            margin: 100px;
            border-radius: 20%;
            transform-origin: top center;
            transition: all 5s;
        }
        #img1:hover{
            transform: rotate(360deg);
            transition: all 5s;
            transform:scale(2,2);
        }
    </style>
</head>
<body>
    <img id="img1" src="images/flower4.jpg" alt="flower">
    <h1>UI Technologies</h1>
</body>
</html>
